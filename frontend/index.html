<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROUTE MATE</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="/static/style.css?v=3">
</head>
<body>

<div class="screen" id="screen">
  <!-- 상단 상태 표시줄 -->
  <header class="topbar">
    <div class="logo"><span class="logo-mark" id="logoMark"></span><span>ROUTE MATE</span></div>
    <div class="clock" id="clock">--:--</div>
    <div class="top-right">
      <span class="chip countdown hidden" id="countdown"></span>
      <span class="chip gear" id="gearChip"></span>
      <button class="icon-btn" id="openSettings" aria-label="설정"></button>
    </div>
  </header>

  <div class="main">
    <!-- 지도 -->
    <section class="map-wrap">
      <svg id="map" viewBox="0 0 520 560" role="img" aria-label="주변 지도"></svg>
      <div class="map-caption" id="mapCaption">목적지 주변</div>
    </section>

    <!-- 도우미 패널 -->
    <section class="assistant">
      <div class="bubble" aria-live="polite">
        <span class="avatar" id="avatar"></span>
        <p id="bubbleText">안녕하세요. 목적지 근처 주차장을 찾고 있어요.</p>
        <button class="icon-btn replay" id="replay" aria-label="다시 듣기"></button>
      </div>
      <ol class="progress" id="progress">
        <li data-stage="park">주차</li>
        <li data-stage="time">시간 설정</li>
        <li data-stage="pick">선택</li>
        <li data-stage="go">진행</li>
      </ol>
      <div class="stage" id="stage"></div>
    </section>
  </div>

  <!-- 설정 시트 -->
  <div class="sheet-backdrop hidden" id="sheetBackdrop"></div>
  <aside class="sheet hidden" id="settings" aria-label="설정">
    <h3>설정</h3>
    <div class="setting-row">
      <div><b>음성 안내</b><small>주행 중에는 화면 대신 음성으로 알려 드려요</small></div>
      <label class="switch"><input type="checkbox" id="voiceOn" checked><span></span></label>
    </div>
    <div class="setting-row col">
      <b>목소리</b>
      <select id="voiceSelect"></select>
      <small id="voiceHint"></small>
    </div>
    <div class="setting-row col">
      <b>말하기 속도 <span id="rateLabel">보통</span></b>
      <input type="range" id="voiceRate" min="0.8" max="1.3" step="0.05" value="1.0">
    </div>
    <div class="setting-row">
      <button class="btn ghost" id="voiceTest">미리 듣기</button>
    </div>
    <hr>
    <div class="setting-row col">
      <b>개인정보</b>
      <small>위치 정보는 이번 이용에만 쓰고, 끝나면 지워요.</small>
      <button class="btn danger-ghost" id="deleteSession">위치 정보 동의 철회 및 기록 삭제</button>
    </div>
    <button class="btn primary wide" id="closeSettings">닫기</button>
  </aside>
</div>

<!-- 시연 도구: 실제 차량 화면에는 없는 영역 -->
<section class="demo-tools">
  <div class="demo-head"><b>시연 도구</b><span>실제 차량 화면에는 없는 영역이에요 · 주차장·일감·상점 정보는 모두 가상 데이터</span></div>
  <div class="demo-row">
    <button id="tick">시각 +5분</button>
    <button id="toggleDrive">주행 ↔ 정차</button>
    <span class="sep"></span>
    <button data-event="traffic_delay">교통 정체 (10분 지연)</button>
    <button data-event="gig_cancelled">업체가 업무 취소</button>
    <button data-event="parking_full">복귀할 주차장 만차</button>
    <button id="resume">추천 다시 받기</button>
    <span class="sep"></span>
    <button id="restart">처음부터</button>
  </div>
  <details><summary>이용 기록 (개발자 확인용)</summary><pre id="audit"></pre></details>
</section>

<script src="/static/voice.js?v=3"></script>
<script src="/static/app.js?v=3"></script>
</body>
</html>
